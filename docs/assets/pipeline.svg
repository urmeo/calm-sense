<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1628" viewBox="0 0 720 1628" role="img" aria-labelledby="pipeline-title pipeline-description">
<title id="pipeline-title">CalmSense pipeline in five steps</title>
<desc id="pipeline-description">Read from top to bottom. WESAD chest recordings from 15 people contain ECG, EDA, temperature, respiration and acceleration. Per-person filtering, feature extraction and signal resampling prepare 60-second windows at a 30-second step, with at least 90 percent eligible label agreement. Each evaluation fold holds out one person before learned transforms or models are fitted. The other 14 people form the training and validation pool. Four feature classifiers use 58 recorded features with training-only median imputation and scaling. The independent 1D CNN uses five channels with 1,024 samples each, different inner training and validation people, normalization on inner training windows only, and early stopping based on validation loss. Each classifier predicts the held-out person separately. The test person is not used for fitting, tuning, validation or early stopping. Repeating this process for all 15 people produces subject-mean accuracy and macro-F1, and pooled balanced accuracy. Saved JSON and CSV results feed plots and a static dashboard, with no live inference. Separate studies cover binary ROC/AUC for the four feature models, calibration, personalization, ablation, chest and wrist comparison, grouped tuning and statistics. Transfer uses 18 shared WESAD wrist and Non-EEG features. Separate full-data fits export a Random Forest model and descriptive XGBoost SHAP values. These are not additional stages of the held-out benchmark, and the browser does not load the exported model.</desc>
<defs><style>
text { font-family: Arial, Helvetica, sans-serif; }
.title { font-size: 36px; font-weight: 700; }
.heading { font-size: 32px; font-weight: 700; }
.body { font-size: 28px; }
.path-title { font-size: 28px; font-weight: 700; }
.number { font-size: 24px; font-weight: 700; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8acfff" stroke-width="1.5"/></marker>
</defs>
