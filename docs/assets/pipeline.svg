<text x="58" y="168" class="number" fill="#121b22" text-anchor="middle">1</text>
<text x="96" y="170" class="heading" fill="#edf3f7" text-anchor="start">Recorded signals</text>
<text x="96" y="202" class="body" fill="#c2d0da" text-anchor="start">WESAD chest · 15 people · 5 channels</text>
</g>
