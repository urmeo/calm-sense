<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
  <title id="title">CalmSense: recordings to held-out results</title>
  <desc id="description">Five steps: WESAD recordings from 15 subjects; filtered 60-second windows with 50 percent overlap and at least 90 percent label purity; 58 features or five signal channels for the CNN; leave-one-subject-out evaluation with preprocessing fitted on training subjects; saved metrics, curves, and dashboard exports.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="350" rx="16" fill="#f8fafc"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="30" y="42" font-size="23" font-weight="700" fill="#17243b">From recordings to held-out results</text>
    <text x="30" y="69" font-size="14" fill="#52627a">WESAD chest benchmark · Baseline / stress, with amusement in the three-class task</text>
    <g fill="#fff" stroke="#dbe3ef">
      <rect x="30" y="103" width="208" height="171" rx="12"/>
      <rect x="263" y="103" width="208" height="171" rx="12"/>
      <rect x="496" y="103" width="208" height="171" rx="12"/>
      <rect x="729" y="103" width="208" height="171" rx="12"/>
      <rect x="962" y="103" width="208" height="171" rx="12"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M241 188h16"/><path d="M474 188h16"/><path d="M707 188h16"/><path d="M940 188h16"/>
    </g>
    <g fill="#2563eb"><circle cx="54" cy="127" r="12"/><circle cx="287" cy="127" r="12"/><circle cx="520" cy="127" r="12"/><circle cx="753" cy="127" r="12"/></g>
    <circle cx="986" cy="127" r="12" fill="#0f766e"/>
    <g fill="#fff" font-size="12" font-weight="700" text-anchor="middle"><text x="54" y="131">1</text><text x="287" y="131">2</text><text x="520" y="131">3</text><text x="753" y="131">4</text><text x="986" y="131">5</text></g>
    <g fill="#17243b" font-size="16" font-weight="700"><text x="46" y="164">Recordings</text><text x="279" y="164">Prepare windows</text><text x="512" y="164">Model inputs</text><text x="745" y="164">LOSO evaluation</text><text x="978" y="164">Saved results</text></g>
    <g fill="#52627a" font-size="13">
      <text x="46" y="194">15 laboratory subjects</text><text x="46" y="217">ECG, EDA, temperature,</text><text x="46" y="240">respiration, and motion</text>
      <text x="279" y="194">Filter signals</text><text x="279" y="217">60 s · 50% overlap</text><text x="279" y="240">At least 90% label purity</text>
      <text x="512" y="194">58 features: four models</text><text x="512" y="217">or CNN: five channels</text><text x="512" y="240">× 1,024 samples</text>
      <text x="745" y="194">Train on 14 subjects</text><text x="745" y="217">Test on the held-out one</text><text x="745" y="240">Repeat for all 15 subjects</text>
      <text x="978" y="194">Metrics and curves</text><text x="978" y="217">Recorded signal excerpts</text><text x="978" y="240">Static results dashboard</text>
    </g>
    <text x="30" y="315" font-size="13" fill="#52627a">Imputation and scaling use training subjects only. The saved full-data model is fitted separately from held-out evaluation.</text>
  </g>
</svg>
