<circle cx="58" cy="304" r="20" fill="#8acfff"/>
<text x="58" y="312" class="number" fill="#121b22" text-anchor="middle">2</text>
<text x="96" y="314" class="heading" fill="#edf3f7" text-anchor="start">Prepare windows</text>
<text x="96" y="346" class="body" fill="#c2d0da" text-anchor="start">60 s windows · 30 s step</text>
<text x="96" y="384" class="body" fill="#c2d0da" text-anchor="start">Keep ≥90% label agreement</text>
</g>
<path d="M 360 414 V 432" fill="none" stroke="#8acfff" stroke-width="2.5" marker-end="url(#arrow)"/>
<g id="step-3" data-step="3">
<rect x="24" y="444" width="672" height="422" rx="14" fill="#172b3c" stroke="#8acfff" stroke-width="2"/>
<circle cx="58" cy="484" r="20" fill="#8acfff"/>
<text x="58" y="492" class="number" fill="#121b22" text-anchor="middle">3</text>
<text x="96" y="494" class="heading" fill="#edf3f7" text-anchor="start">Train on 14 people</text>
<text x="96" y="526" class="body" fill="#c2d0da" text-anchor="start">Hold out 1 person before fitting</text>
<g id="feature-path">
<rect x="48" y="548" width="624" height="110" rx="14" fill="#121b22" stroke="#527da0" stroke-width="2"/>
<text x="72" y="588" class="path-title" fill="#edf3f7" text-anchor="start">4 feature classifiers · 58 features</text>
<text x="72" y="630" class="body" fill="#c2d0da" text-anchor="start">Fit medians + scaling on training people</text>
</g>
<g id="cnn-path">
<rect x="48" y="678" width="624" height="164" rx="14" fill="#121b22" stroke="#527da0" stroke-width="2"/>
<text x="72" y="718" class="path-title" fill="#edf3f7" text-anchor="start">1D CNN · 5 channels × 1,024</text>
<text x="72" y="754" class="body" fill="#c2d0da" text-anchor="start">Different training / validation people</text>
<text x="72" y="790" class="body" fill="#c2d0da" text-anchor="start">Normalize on inner training windows</text>
<text x="72" y="826" class="body" fill="#c2d0da" text-anchor="start">Early stopping uses validation loss</text>
</g>
</g>
<path d="M 360 872 V 890" fill="none" stroke="#8acfff" stroke-width="2.5" marker-end="url(#arrow)"/>
<g id="step-4" data-step="4">
<rect x="24" y="902" width="672" height="144" rx="14" fill="#18332f" stroke="#88dfca" stroke-width="2"/>
<circle cx="58" cy="942" r="20" fill="#88dfca"/>
<text x="58" y="950" class="number" fill="#121b22" text-anchor="middle">4</text>
<text x="96" y="952" class="heading" fill="#edf3f7" text-anchor="start">Test one unseen person</text>
<text x="96" y="984" class="body" fill="#c2d0da" text-anchor="start">Apply each fitted model independently</text>
<text x="96" y="1022" class="body" fill="#c2d0da" text-anchor="start">No fitting, tuning or validation</text>
</g>
<path d="M 360 1052 V 1070" fill="none" stroke="#8acfff" stroke-width="2.5" marker-end="url(#arrow)"/>
<g id="step-5" data-step="5">
<rect x="24" y="1082" width="672" height="252" rx="14" fill="#1b2832" stroke="#8acfff" stroke-width="2"/>
<circle cx="58" cy="1122" r="20" fill="#8acfff"/>
<text x="58" y="1130" class="number" fill="#121b22" text-anchor="middle">5</text>
<text x="96" y="1132" class="heading" fill="#edf3f7" text-anchor="start">Score and save</text>
<text x="96" y="1164" class="body" fill="#c2d0da" text-anchor="start">Repeat for all 15 people</text>
<text x="96" y="1200" class="body" fill="#c2d0da" text-anchor="start">Accuracy + macro-F1: mean by person</text>
<text x="96" y="1236" class="body" fill="#c2d0da" text-anchor="start">Balanced accuracy: pool test predictions</text>
<text x="96" y="1272" class="body" fill="#c2d0da" text-anchor="start">JSON / CSV → charts + dashboard</text>
<text x="96" y="1308" class="body" fill="#88dfca" text-anchor="start">Saved results; no live inference</text>
</g>
<g id="separate-runs">
<rect x="24" y="1360" width="672" height="244" rx="14" fill="#1b2832" stroke="#405261" stroke-width="2"/>
<text x="48" y="1400" class="path-title" fill="#edf3f7" text-anchor="start">Separate studies and exports</text>
<text x="48" y="1438" class="body" fill="#c2d0da" text-anchor="start">ROC/AUC: 4 feature models</text>
<text x="48" y="1474" class="body" fill="#c2d0da" text-anchor="start">Calibration · personalization · ablation</text>
<text x="48" y="1510" class="body" fill="#c2d0da" text-anchor="start">Chest/wrist · grouped tuning · statistics</text>
<text x="48" y="1546" class="body" fill="#c2d0da" text-anchor="start">WESAD wrist ↔ Non-EEG · 18 features</text>
<text x="48" y="1582" class="body" fill="#c2d0da" text-anchor="start">Full-data fits: RF export · XGBoost SHAP</text>
</g>
</svg>
